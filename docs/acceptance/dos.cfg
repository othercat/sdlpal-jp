# Unified acceptance / SDL2 x64 / reviewed Steam PAL_DOS resources.
# This is a Windows executable using DOS data, not a DOSBox program.
# Launch from the package DOS directory. UTF-8, no BOM.
GamePath=./data/
SavePath=./saves/
MessageFileName=paljpn-dos.slf
PortraitFileName=paljpn-dos.por
# Japanese 16px and UseISOFont=0 come from the SLF; no external font.
Music=RIX
CD=NONE
MusicVolume=70
SoundVolume=70
WindowWidth=640
WindowHeight=400
TextureWidth=320
TextureHeight=200
KeepAspectRatio=1
FullScreen=0
LaunchSetting=0
UseTouchOverlay=0
EnableAviPlay=0
ScaleQuality=0
EnableGLSL=0
EnableHDR=0
LogLevel=2
LogFileName=./sdlpal.log
